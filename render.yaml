services:
  # 1. FastAPI AI & Clinical Safety Backend
  - type: web
    name: allergysafe-table-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: ENVIRONMENT
        value: production

  # 2. Next.js Frontend Web Application
  - type: web
    name: allergysafe-table-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: allergysafe-table-api
          property: host
