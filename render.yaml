services:
  # 1. FastAPI AI & Clinical Safety Backend
  - type: web
    name: allergysafe-table-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: ENVIRONMENT
        value: production
      # Set in the Render dashboard; never commit the key.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_MODEL
        value: eleven_v4_turbo

  # 2. Next.js Frontend Web Application
  - type: web
    name: allergysafe-table-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build"
    startCommand: "cd frontend && npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      # Public URL of the backend service above. The Next.js server proxies
      # /api/* to it, so the browser never calls the backend directly.
      # Render may add a suffix to the name (e.g. -abcd) if it is taken:
      # copy the real URL from the backend's dashboard page, update this
      # value, and redeploy the frontend (it is read at build time).
      - key: BACKEND_URL
        value: https://allergysafe-table-api.onrender.com
